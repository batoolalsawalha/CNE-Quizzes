<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Graduation Cap & Network Nodes -->
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cap top diamond -->
    <polygon points="256,120 440,210 256,300 72,210" fill="#ffffff" fill-opacity="0.15"/>
    <polygon points="256,120 440,210 256,300 72,210"/>
    <!-- Cap skull base -->
    <path d="M140,250 L140,350 C140,390 372,390 372,350 L372,250"/>
    <!-- Tassel -->
    <path d="M440,210 L440,330 C440,345 425,355 425,370"/>
    <circle cx="425" cy="385" r="14" fill="#ffffff"/>
    <!-- Network nodes connecting below -->
    <circle cx="170" cy="420" r="16" fill="#38bdf8"/>
    <circle cx="256" cy="450" r="18" fill="#60a5fa"/>
    <circle cx="342" cy="420" r="16" fill="#38bdf8"/>
    <line x1="184" y1="424" x2="240" y2="445" stroke="#93c5fd" stroke-width="8"/>
    <line x1="328" y1="424" x2="272" y2="445" stroke="#93c5fd" stroke-width="8"/>
  </g>
  <!-- Text Label -->
  <text x="256" y="235" font-family="Inter, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">CNE</text>
</svg>
